# Netlify build configuration for the Kanso storefront.
#
# The deploy itself is the maintainer's: connect the GitHub repo
# https://github.com/abu-bilaall/kanso in the Netlify UI and set the two
# `VITE_` variables there. Nothing in this file is a secret, and nothing in
# this file should ever become one — the Supabase publishable key is public by
# design, and the service-role key is never reachable from a browser.
#
# `npm run build` is the repository root's script, which delegates to the app's
# own `tsc -b && vite build`, so a type error still fails the build rather than
# shipping a broken bundle. Vite writes to `apps/web/dist`.
#
# There is deliberately no `base` directory. The repository root stays the
# install root, which is the one arrangement already proven by the deploy that
# serves use-kanso.netlify.app today: `npm ci` reads the committed root lockfile
# and resolves the app's dependencies through the `apps/*` workspace. Setting a
# base directory would move dependency installation into `apps/web`, where there
# is no lockfile of its own — an arrangement that cannot be verified without a
# real deploy, and an install failure is invisible until customers see it. Only
# `publish` moves, because only the build output moved. The rewrite rules below
# are relative to the published site root and are unaffected.

[build]
  command = "npm run build"
  publish = "apps/web/dist"

[build.environment]
  # Pinned so a Netlify image update cannot silently change the toolchain under
  # a green build. `package.json` asks for `node >= 22`; 24 is the version
  # Netlify's build image defaults to for new sites and the one its `nvm` cache
  # certainly has. If you bump the floor in `engines`, bump this too.
  NODE_VERSION = "24"

# History-API routing.
#
# This is a client-side-routed SPA (`createBrowserRouter` in
# `apps/web/src/main.tsx`), so `/shop`, `/product/:slug`, `/cart`, `/checkout`,
# `/order/:id`, `/account`
# and `/auth/callback` are all real URLs that must survive a hard refresh and a
# shared link. Without this rule Netlify looks for a file at each of those paths,
# finds none, and returns 404 — the app never even boots, so there is no
# client-side router left to rescue the route.
#
# `status = 200` makes this a rewrite, not a redirect: the browser keeps the URL
# it asked for. There is deliberately no `force = true`, so real files still win
# and `/assets/*.js` is served as itself. This is Netlify's documented SPA recipe.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
